<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - CRM Ituarte</title>
    <link rel="stylesheet" href="vendor/fonts/work-sans.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
    body {
      font-family: 'Work Sans', sans-serif;
      background: linear-gradient(135deg, #ff0000, #af0303);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 420px;
      max-width: 100%;
    }
    h2 { text-align: center; margin-bottom: 8px; }
    p.sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .perfil-seccion {
      margin: 16px 0 8px;
      padding: 16px 16px 4px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fffafa 0%, #fff 55%);
      border: 1px solid rgba(198, 40, 40, 0.14);
      border-left: 4px solid #c62828;
      box-shadow: 0 2px 8px rgba(198, 40, 40, 0.06);
    }
    .perfil-seccion h3 {
      font-size: 15px;
      margin: 0 0 6px;
      padding-bottom: 8px;
      font-weight: 700;
      color: #b71c1c;
      border-bottom: 2px solid rgba(198, 40, 40, 0.22);
    }
    .perfil-seccion .hint {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .msg { margin-top: 12px; font-size: 14px; text-align: center; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
    .links { text-align: center; margin-top: 16px; font-size: 14px; }
    .links a { color: #c62828; }

    @media (max-width: 768px) {
      body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 4vh;
      }

      .box {
        width: 100%;
        max-width: 100%;
        padding: 36px 28px;
        border-radius: 16px;
      }

      h2 {
        font-size: 1.85rem;
        margin-bottom: 10px;
      }

      p.sub {
        font-size: 1.05rem;
        margin-bottom: 24px;
      }

      input,
      button {
        font-size: 17px;
        padding: 16px;
        margin-bottom: 14px;
        border-radius: 14px;
      }

      button {
        margin-top: 10px;
        padding: 17px;
      }

      .msg {
        font-size: 1rem;
        margin-top: 16px;
      }

      .links {
        margin-top: 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Registrarse</h2>
    <p class="sub">Creá tu cuenta de cliente para ver tus consultas</p>

    <form onsubmit="registrar(event)">
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="apellido" placeholder="Apellido">
      <input type="email" id="email" placeholder="Email" required>
      <input type="tel" id="telefono" placeholder="Teléfono">
      <input type="text" id="ciudad" placeholder="Ciudad">
      <div class="perfil-seccion">
        <h3>Perfil comercial</h3>
        <p class="hint">Opcional — nos ayuda a atenderte mejor</p>
        <select id="tipoClienteRegistro" aria-label="Tipo de cliente">
          <option value="particular">Particular</option>
          <option value="profesional">Profesional</option>
          <option value="empresa">Empresa</option>
          <option value="municipalidad">Municipalidad</option>
        </select>
        <select id="rubroRegistro" aria-label="Rubro">
          <option value="">Rubro / profesión (opcional)</option>
          <option value="arquitecto">Arquitecto</option>
          <option value="ingeniero">Ingeniero</option>
          <option value="electricista">Electricista</option>
          <option value="diseñador_interiores">Diseñador de interiores</option>
          <option value="constructor">Constructor</option>
          <option value="municipalidad">Municipalidad / Alumbrado público</option>
          <option value="empresa_industrial">Empresa industrial</option>
          <option value="comercio">Comercio</option>
          <option value="otro">Otro</option>
        </select>
        <input type="text" id="empresaRegistro" placeholder="Empresa / estudio (opcional)">
        <label for="fechaNacimientoRegistro" class="sr-only">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimientoRegistro" aria-label="Fecha de nacimiento (opcional)">
      </div>
      <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6">
      <button type="submit">Crear cuenta</button>
    </form>

    <div id="mensaje" class="msg"></div>
    <div class="links">
      <a href="login.html">¿Ya tenés cuenta? Iniciá sesión</a>
    </div>
  </div>

  <script src="js/crm-public-api.js"></script>
  <script src="js/form-perfil-comercial.js"></script>
  <script>
    async function registrar(e) {
      e.preventDefault();
      const msg = document.getElementById("mensaje");

      const perfil = typeof leerPerfilComercial === "function"
        ? leerPerfilComercial("Registro")
        : {};

      const body = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        email: document.getElementById("email").value,
        telefono: document.getElementById("telefono").value,
        ciudad: document.getElementById("ciudad").value,
        password: document.getElementById("password").value,
        ...perfil
      };

      try {
        const res = await fetch(crmPublicUrl("/auth/registro"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok) {
          msg.className = "msg err";
          msg.innerText = data.error;
          return;
        }

        msg.className = "msg ok";
        msg.innerHTML = data.mensaje + ' <a href="login.html">Iniciar sesión</a>';
      } catch {
        msg.className = "msg err";
        msg.innerText = "Error de conexión con el servidor";
      }
    }
  </script>
</body>
</html>
