<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar contraseña - CRM Ituarte</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Work Sans', sans-serif;
      background: linear-gradient(135deg, #ff0000, #af0303);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 440px;
      max-width: 100%;
    }
    h2 { margin-bottom: 10px; text-align: center; }
    p { color: #64748b; font-size: 14px; margin-bottom: 16px; line-height: 1.5; text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .msg { margin-top: 15px; font-size: 14px; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
    .link-box {
      margin-top: 16px;
      padding: 14px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 10px;
      word-break: break-all;
    }
    .link-box a { color: #c62828; font-weight: 600; }
    .volver { display: block; text-align: center; margin-top: 20px; color: #c62828; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Recuperar contraseña</h2>

    <p>Ingresá el email con el que te registraste en el CRM. Te enviaremos un link para restablecer tu contraseña.</p>

    <form onsubmit="recuperar(event)">
      <input type="email" id="email" placeholder="tu@email.com" required>
      <button type="submit">Generar link de recuperación</button>
    </form>

    <div id="mensaje" class="msg"></div>
    <a href="login.html" class="volver">← Volver al login</a>
  </div>

  <script>
    async function recuperar(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("mensaje");

      try {
        const res = await fetch("http://localhost:3000/auth/recuperar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        msg.className = "msg ok";
        msg.innerHTML = data.mensaje;

        if (data.link_recuperacion) {
          msg.innerHTML += `
            <div class="link-box">
              <strong>Hacé clic para restablecer tu contraseña:</strong><br><br>
              <a href="${data.link_recuperacion}">${data.link_recuperacion}</a>
              <br><br>
              <small>El link expira en 1 hora.</small>
            </div>`;
        }
      } catch {
        msg.className = "msg err";
        msg.innerText = "Error de conexión con el servidor";
      }
    }
  </script>
</body>
</html>
