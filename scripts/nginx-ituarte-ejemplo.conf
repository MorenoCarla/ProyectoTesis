# Ejemplo para cuando tengan dominio + Nginx delante de Node (PM2 puerto 3000).
# Copiar ideas a /etc/nginx/sites-available/ituarte

server {
    listen 80;
    server_name electricidadituarte.com.ar www.electricidadituarte.com.ar;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
